name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurante_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            sleep 2
          done
      
      - name: Initialize Database
        run: |
          mysql -h 127.0.0.1 -u root -proot restaurante_db < database/restaurante_db.sql
      
      - name: Configure DB Properties
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/db.properties << EOF
          db.url=jdbc:mysql://127.0.0.1:3306/restaurante_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          db.user=root
          db.password=root
          db.driver=com.mysql.cj.jdbc.Driver
          EOF
      
      - name: Compile and Run Automated JUnit Tests
        run: mvn clean test -B
